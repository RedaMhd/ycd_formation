<body>
    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="index.html" class="logo"><img src="img/ChatGPT Image 9 oct. 2026, 14_54_00.png" alt="">Élan Fitness</a>


            <nav aria-label="Navigation principale">
                <img src="img/icone-coach.svg" alt="">

                <ul class="menu">

            </nav>
        </div>
    </header>
    <div>
        <div class="contact-nous">
            <form action="index.html" class="contact-form formule-populaire">
                <h1>Contactez-nous!!</h1>
                <label for="non" aria-required="true">Nom :</label>
                <input type="text" id="non" placeholder="ex : Reda" required>

                <label for="pnom">Prenom :</label>
                <input type="text" id="pnom" placeholder="ex : MOUHDI" required>

                <label for="phone">Num Telephone :</label>
                <input type="tel" id="phone" placeholder="ex : 0653392315" pattern="[0](5|6|7)[0-9]{8}" required>

                <label for="email">Emaile :</label>
                <input type="text" id="email" placeholder="ex : mouhdi.reda@gmail.com" required>

                <label for="massage">Message</label>
                <textarea id="massage" required></textarea>

                <input id="btn" class="bouton bouton-secondaire" type="submit" value="Envoyer">
            </form>
        </div>
    </div>
    <footer class="pied-de-page">
        <div class="conteneur">

            <div class="pied-haut">
                <div>
                    <p class="logo logo-clair">Élan Fitness</p>
                    <p class="slogan">Ton énergie, ton rythme.</p>

                    </ul>
                </nav>
            </div>

            <div class="pied-bas">
                <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
                <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
            </div>

        </div>
    </footer>
</body>

</html>
